name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  CodeQL:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm pkg-config libcjson-dev libwebsockets-dev \
            libcurl4-openssl-dev libssl-dev
      - uses: github/codeql-action/init@v4.37.6
        with:
          # fc#1652: this repo also carries 8 Python websocket test harnesses under
          # tests/ (45KB by the linguist census) and they were unanalysed. The C leg
          # needs the traced `make` below; Python is a no-build extractor and simply
          # rides along on the same init, so this costs one extraction and no new step.
          languages: c-cpp,python
      - name: Build
        run: make
      - uses: github/codeql-action/analyze@v4.37.6

