version: 2

# skyphusion-labs Dependabot standard -- see fleet-chezmoi/docs/runbooks/dependabot-standard.md
# PRs only (never auto-merge). Group minor/patch; majors stay separate. Peer families bump together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # Stay on Ubuntu 24.04 until NASM 3.x on 26.04 builds cleanly.
    # 26.04 ships nasm 3.01, which fails under -Wall -Werror with:
    #   error: 32-bit relative section-crossing relocation [-w+error=reloc-rel-dword]
    # (hollow-grid-asm#43, #46). hollow-grid-c is pure C and can track 26.04.
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]
